name: Evidências Watson E2E

on:
  push:
    branches:
      - feat/watson-assistant-voice
    paths:
      - components/WatsonAssistantChat.tsx
      - scripts/watson-e2e.mjs
      - .github/workflows/watson-e2e.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watson-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web Chat, automações e voz
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_URL: https://reuse-lucasbuzatos-projects.vercel.app
      VOICE_URL: https://reuse-git-feat-watson-assistant-voice-lucasbuzatos-projects.vercel.app
      EVIDENCE_DIR: docs/evidence/watson

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: feat/watson-assistant-voice

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar Playwright efêmero
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Executar testes reais publicados
        run: node scripts/watson-e2e.mjs

      - name: Versionar evidências sem credenciais
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/watson
          if git diff --cached --quiet; then
            echo "Nenhuma evidência nova para versionar."
            exit 0
          fi
          git commit -m "test: registrar evidências E2E do Watson"
          git push origin HEAD:feat/watson-assistant-voice
