name: Qualidade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/fase-final-fullstack]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API Node.js + Prisma + AdminJS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reuse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reuse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reuse?schema=public
      AUTH_SECRET: ci-only-placeholder-not-used-in-production
      RUN_DATABASE_TESTS: "1"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Aplicar migrations
        run: npm run prisma:deploy

      - name: Popular dados de demonstração
        run: npm run prisma:seed

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes (inclui banco real)
        run: npm test

      - name: Gerar bundle do painel AdminJS
        run: npm run admin:bundle

  frontend:
    name: Site Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes, lint, tipos e build
        run: npm run check
